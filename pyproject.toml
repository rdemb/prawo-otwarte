[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prawo-otwarte"
version = "0.1.0"
description = "Source-first, open Polish legal research assistant"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
prawo = "prawo.cli:main"

[tool.setuptools.packages.find]
include = ["prawo*"]

[tool.setuptools.package-data]
prawo = ["static/*", "config/*.json"]
