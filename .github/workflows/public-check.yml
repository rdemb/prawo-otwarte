name: Public HTTPS and model check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-check.yml'
      - 'scripts/check_public_service.py'
permissions:
  contents: read
concurrency:
  group: public-service-check
  cancel-in-progress: false
jobs:
  public-check:
    if: github.ref == 'refs/heads/main' && vars.PRAWO_API_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRAWO_API_BASE_URL: ${{ vars.PRAWO_API_BASE_URL }}
      PRAWO_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify peer certificate and public health
        run: python -m scripts.check_public_service --phase tls
      - name: Check published configuration, CORS and synthetic intake
        run: python -m scripts.check_public_service --phase api
