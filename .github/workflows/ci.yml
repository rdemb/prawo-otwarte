name: application-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.check_public_repo
      - run: python -m compileall -q prawo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check prawo/static/app.js
      - run: node --check prawo/static/pages.js
